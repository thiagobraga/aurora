# Small-VPS profile (e.g. OCI Always Free, 1 GB RAM). A host reverse proxy
# terminates TLS and forwards to 127.0.0.1:${APP_PORT}. Memory limits keep
# the whole stack under ~450 MB.
services:
  app:
    build:
      context: .
      dockerfile: .docker/app/Dockerfile
      target: production
    ports: ["127.0.0.1:${APP_PORT:-8080}:80"]
    networks: [edge, backend]
    depends_on: [api]
    mem_limit: 64m
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: .docker/api/Dockerfile
      target: production
    networks: [backend, data]
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 192m
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    networks: [data]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 192m
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

networks:
  edge:
  backend:
    internal: true
  data:
    internal: true
